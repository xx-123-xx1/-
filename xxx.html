<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLC 段码屏模拟器 (共阴极)</title>
<style>
  body {
    background-color: #1a1a1a;
    color: #eee;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }

  h1 {
    color: #00ffcc;
    margin-bottom: 5px;
    font-size: 24px;
  }

  .subtitle {
    color: #888;
    margin-bottom: 30px;
    font-size: 14px;
  }

  /* 数码管外壳 */
  .segment-display {
    position: relative;
    width: 200px;
    height: 300px;
    background-color: #111;
    border-radius: 15px;
    padding: 20px;
    box-shadow: inset 0 0 20px #000, 0 0 15px rgba(0, 255, 204, 0.1);
    border: 2px solid #333;
    margin-bottom: 40px;
  }

  /* 数码管背景网格，增加真实感 */
  .segment-display::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 20px 20px;
    border-radius: 15px;
    pointer-events: none;
  }

  /* 段的通用样式 */
  .seg {
    position: absolute;
    background-color: #222;
    transition: background-color 0.1s, box-shadow 0.1s;
    /* 未点亮时的微弱轮廓 */
    border: 1px solid #1a1a1a; 
  }

  /* 点亮状态：共阴极，高电平亮（红色） */
  .seg.on {
    background-color: #ff2a2a;
    box-shadow: 0 0 20px #ff2a2a, 0 0 40px rgba(255, 42, 42, 0.5);
    border: 1px solid #ff5555;
  }

  /* 定义水平段 (a, g, d) 的形状 - 两端带斜角 */
  .seg-h {
    height: 18px;
    width: 90px;
    clip-path: polygon(10% 0%, 90% 0%, 100% 50%, 90% 100%, 10% 100%, 0% 50%);
    left: 55px;
  }

  /* 定义垂直段 (b, c, e, f) 的形状 - 两端带斜角 */
  .seg-v {
    width: 18px;
    高度: 90px;
    剪辑路径: 多边形(0% 10%, 50% 0%, 100% 10%, 100% 90%, 50% 100%, 0% 90%);
  }

  /*各段位置定位*/
  #seg-a { top: 25px; 左: 55px; }
  #seg-b { top: 45px; 正确的: 20px; } /*右上角*/
  #seg-c { 底部: 45px; 正确的: 20px; } /*右下角*/
  #seg-d { 底部: 25px; 左: 55px; }
  #seg-e { 底部: 45px; 左: 20px; } /*左下*/
  #seg-f { top: 45px; 左: 20px; } /* 左上 */
  #seg-g { top: 145px; 左: 55px; }

  /* 控制面板 */
  .控制面板 {
    display: flex;
    挠曲方向: column;
    align-items: center;
    gap: 15px;
    width: 100%;
    max-width: 320px;
  }

  .输入组 {
    display: flex;
    gap: 10px;
    宽度: 100%;
  }

  输入[类型="数字"] {
    弯曲: 1;
    填充: 12PX 15PX;
    字体大小: 18PX;
    边界半径: 8PX;
    边境: 2PX 固体 #444;
    背景色: #222;
    颜色：#fff；
    概要: 没有一个;
    文本对齐: 中心;
    过渡: 边框颜色 0.3s;
  }

  输入[类型="数字"]:集中 {
    边框颜色：#00ffcc；
  }

  按钮 {
    填充: 12PX 20PX;
    字体大小: 16PX;
    边境: 没有一个;
    边界半径: 8PX;
    背景色：#00ffcc；
    颜色: #111;
    字体粗细: 大胆的;
    光标: 指针;
    过渡: 背景色 0.2s, 改变 0.1s;
  }

  按钮:盘旋 {
    背景色：#00ccaa；
  }

  按钮:活跃的 {
    改变: 规模(0.95);
  }

  /* 数字快捷键盘 */
  .键盘 {
    显示: 网格;
    网格模板列: 重复(5, 1Fr);
    差距: 8PX;
    宽度: 100%;
  }

  .键盘 按钮 {
    填充: 12PX 0;
    字体大小: 18PX;
    背景色: #333;
    颜色：#ddd；
    边境: 1PX 固体 #444;
  }

  .键盘 按钮:盘旋 {
    背景色: #444;
    颜色：#00ffcc；
  }

  .键盘 按钮.清楚的 {
    格线柱: 跨度 5;
    背景色: #661111;
    颜色：#ff9999；
  }

  .键盘 按钮.清楚的:盘旋 {
    背景色: #882222;
  }

  .状态 {
    上边距: 10PX;
    字体大小: 14PX;
    颜色: #888;
    高度: 20PX;
  }
</风格>
</头>
